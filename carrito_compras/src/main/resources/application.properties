spring.application.name=carrito-compras
server.port=8082
spring.datasource.url=jdbc:mysql://${DB_HOST}:3306/bd_carrito_compras?serverTimezone=UTC&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER}
spring.datasource.password=${BD_PASSWORD}

spring.jpa.hibernate.ddl-auto=${DDL_AUTO}
spring.jpa.show-sql=true

eureka.client.service-url.defaultZone=http://${EUREKA_HOST}:8761/eureka